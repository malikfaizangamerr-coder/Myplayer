<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Shaka Player UI (v4.16.3) - TV Optimized</title>
    <!-- Load Shaka Player UI components -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/shaka-player.ui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/controls.css">
    <!-- Load Material Icons for Shaka UI -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            height: 100%;
            overflow: hidden;
        }

        #video-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            background: #000;
            object-fit: contain;
        }

        /* Overlay image (agar aap use kar rahe hain) */
        #overlay-image {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 5;
        }

        .shaka-controls-container {
            z-index: 10 !important;
        }

        .shaka-play-button {
            z-index: 15 !important;
        }

        /* Premium menu styles */
        .shaka-settings-menu {
            background: rgba(30, 30, 30, 0.6) !important;
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 220px;
            animation: fadeIn 0.25s ease;
        }

        .shaka-settings-menu button {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            border-radius: 8px;
            padding: 6px 12px;
            margin: 4px 0;
            border: 2px solid rgba(255, 255, 255, 0.35);
            font-size: 13px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .shaka-settings-menu button::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0, 198, 255, 0.12), rgba(0, 114, 255, 0.12));
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 8px;
            z-index: 0;
        }

        .shaka-settings-menu button:hover::before,
        .shaka-settings-menu button:focus::before {
            opacity: 1;
        }

        .shaka-settings-menu button:hover,
        .shaka-settings-menu button:focus {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
            color: #fff;
        }

        .shaka-settings-menu button[aria-checked="true"] {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 12px rgba(0, 198, 255, 0.7);
        }

        .shaka-settings-menu button:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

<body>
    <div id="video-container">
        <!-- Autoplay ke liye muted zaroori hai -->
        <video id="video" poster="https://dns-tv.pages.dev/logo/loading.gif" class="shaka-video" playsinline autoplay muted></video>
        <div class="shaka-controls-container" shaka-controls></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            shaka.polyfill.installAll();

            const params = new URLSearchParams(window.location.search);
            const manifestUri = params.get('manifest');
            const keyHex = params.get('key');
            const keyIdHex = params.get('keyid');
            const thumpUri = params.get('thumb');

            if (!manifestUri) {
                console.warn('No "manifest" URI found in URL. Player initialization aborted.');
                return;
            }

            const video = document.getElementById('video');
            const overlayImage = document.getElementById('overlay-image');
            const container = document.getElementById('video-container');

            if (thumpUri) {
                video.poster = thumpUri;
            }

            const player = new shaka.Player(video);
            const ui = new shaka.ui.Overlay(player, container, video);

            player.addEventListener('error', (e) => {
                console.error('Shaka Player Error:', e.detail);
            });

            // ClearKey DRM setup
            if (keyIdHex && keyHex) {
                try {
                    const clearKeyMap = {};
                    clearKeyMap[keyIdHex] = keyHex;
                    player.configure({
                        drm: {
                            clearKeys: clearKeyMap,
                            servers: { 'org.w3.clearkey': manifestUri }
                        }
                    });
                } catch (e) {
                    console.error('ClearKey setup failed.', e);
                }
            }

            // UI Configuration for TV / Keyboard
            ui.configure({
                controlPanelElements: [
                    'play_pause', 'time_and_duration',
                    'spacer', 'mute', 'fit_mode', 'volume', 'captions', 'picture_in_picture', 'quality', 'playback_rate',
                    'cast', 'fullscreen'
                ],
                enableQualitySelection: true,
                addBigPlayButton: true,
                // Keyboard/Remote navigation enable karein
                enableKeyboardPlaybackControls: true 
            });

            // Start from lowest quality (360p)
            // defaultBandwidthEstimate ko kam set karne se player low quality se start hota hai
            player.configure({
                abr: {
                    enabled: true,
                    defaultBandwidthEstimate: 200000 // ~200 kbps, forces lowest variant
                }
            });

            // TV Remote: DPAD_CENTER (OK button) handling
            // Agar focus player par hai, to OK button se play/pause toggle karein
            document.addEventListener('keydown', (e) => {
                // DPAD_CENTER Android par 'Enter' ke roop mein aata hai
                if (e.key === 'Enter' || e.keyCode === 13) {
                    // Agar focus kisi button par nahi hai, to play/pause toggle karein
                    if (document.activeElement === document.body || document.activeElement === video) {
                        if (video.paused) {
                            video.play();
                        } else {
                            video.pause();
                        }
                    }
                }
            });

            // Load manifest
            try {
                await player.load(manifestUri);
                console.log('Video loaded successfully:', manifestUri);
                // Ensure autoplay triggers
                video.play().catch(e => console.warn('Autoplay blocked:', e));
            } catch (e) {
                console.error('Error loading video manifest', e);
            }

            // Remove overlay when playback starts
            video.addEventListener('playing', () => {
                if (overlayImage) {
                    overlayImage.style.transition = 'opacity 0.5s ease-out';
                    overlayImage.style.opacity = '0';
                    setTimeout(() => overlayImage.remove(), 500);
                }
            });
        });
    </script>
</body>
</html>
